<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Intro SpotifAKE</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b0b0e;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            border-radius: 30px;
        }

        .logo-container {
            text-align: center;
            animation: fadeInOut 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Стиль для твоего логотипа */
        .logo-img {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            object-fit: contain; /* Чтобы логотип не растягивался */
            /* Плавное свечение вокруг лого */
            filter: drop-shadow(0 10px 40px rgba(30, 215, 96, 0.4));
        }

        h2 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin: 0;
            background: linear-gradient(to right, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.85); filter: blur(15px); }
            15% { opacity: 1; transform: scale(1); filter: blur(0); }
            85% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.08); filter: blur(10px); }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo-img">
        <h2>SpotifAKE</h2>
    </div>
</body>
</html>
